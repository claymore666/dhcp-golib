name: verify

# One job, and its verdict IS ./verify.sh's verdict. Nothing here decides
# anything the arbiter has not already decided; the last step exists only to
# refuse a green run in which the arbiter did not speak.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: the arbiter
    runs-on: ubuntu-24.04
    # Twice the measurement, and the measurement is here so the next person
    # does not have to guess what it was: run 33995090303, the serialised
    # shape below, took 4823s in the arbiter step and 81 minutes end to end.
    # That run was RED and carried three suites that ran into their own 180s
    # hang timeout, so a green run is shorter, not longer; this bound is
    # deliberately taken over the slower of the two shapes measured.
    timeout-minutes: 160
    steps:
      - name: Check out the commit under verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go, from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # dnsmasq-base ships /usr/sbin/dnsmasq without the system service: the
      # namespaced tests start their own server inside their own netns, and a
      # service that binds :53 and :67 in the runner's namespace is a package
      # postinst that can fail for reasons this repository does not own.
      - name: Install what the arbiter shells out to
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dnsmasq-base iproute2 shellcheck

      # MEASURED, run 33992151078 on ubuntu-24.04, with this sysctl left at its
      # Ubuntu default of 1: the namespaced child STARTS — the user namespace is
      # created — and then every capability inside it is denied. The row read
      #   netns-suite FAIL exit 1 after 1s: --- FAIL: TestASquatterInTheProbeWindowMakesAWaitingClientDecline (0.00s)
      # over `ip link add cli0 type veth peer name srv0: exit status 2 /
      # RTNETLINK answers: Operation not permitted` and, for the one test that
      # nests a second namespace, `unshare(CLONE_NEWNET): operation not
      # permitted`. AppArmor transitions an unconfined process that creates an
      # unprivileged user namespace into a profile that holds no capabilities.
      #
      # This is the smallest thing that lets the SAME tests run unprivileged:
      # the arbiter step below is not run under sudo, and no test changed.
      - name: Let an unprivileged user namespace keep the capabilities it creates
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Record the machine this measurement was taken on
        run: |
          {
            echo "run:            ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "commit:         ${GITHUB_SHA}"
            echo "kernel:         $(uname -srm)"
            echo "cores (nproc):  $(nproc)"
            echo "dnsmasq:        $( (dnsmasq --version || true) | head -n 1)"
            echo "go:             $(go version)"
            echo "userns sysctl:  $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1 || true)"
            echo "userns maxuser: $(sysctl -n user.max_user_namespaces 2>&1 || true)"
          } | tee runner-facts.txt

      # The unit-suite row is a WALL CLOCK against a 60s ceiling, and that
      # ceiling asks one question: has the suite drifted into waiting. A cold
      # -race build is not waiting, and on the session box the ceiling was
      # derived against a cache a developer has already warmed. MEASURED: the
      # same suite on two cores of the session box takes 35s cold and 25s warm,
      # and run 33992151078 took 67s cold here. Compiling the race build before
      # the arbiter starts changes nothing the row measures — same flags, same
      # binaries, no test touched — it only puts this runner in the state the
      # ceiling was derived in.
      - name: Compile the race build before anything is timed against a ceiling
        run: go test -race -count=1 -run '^$' ./... > /dev/null

      # ALWAYS --oracle. The skip stamp is a per-clone local cache that a fresh
      # runner cannot have, so the flag costs nothing here and removes the one
      # shape in which this job could report PASS over an oracle that never ran.
      # ORACLE_JOBS is 1 and it is DERIVED, not chosen for speed. This runner
      # has two cores. MEASURED, run 33992151078 at two jobs: the root run's
      # suite took 67s and the oracle's own copies took 77s to 99s, all over
      # the 60s ceiling, and fifteen of the seventeen scenarios that did not
      # behave failed for that and nothing else. One job gives a copy the whole
      # machine, which is the only state in which the shipped ceiling has ever
      # been measured to hold. It costs wall clock; it does not move a bound.
      - name: Run the arbiter — always with --oracle, never the cached skip
        run: |
          started="$(date +%s)"
          set +e
          ORACLE_JOBS=1 ./verify.sh --oracle 2>&1 | tee verify-output.txt
          rc="${PIPESTATUS[0]}"
          set -e
          printf 'arbiter exit status: %d\narbiter wall clock: %ds\n' \
            "$rc" "$(( $(date +%s) - started ))" | tee -a runner-facts.txt
          exit "$rc"

      - name: Keep the output whatever the verdict was
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verify-output.txt
            runner-facts.txt
          if-no-files-found: warn
          retention-days: 30

      # The vacuity refusal. A job whose only operand is an exit status cannot
      # tell an arbiter that passed from an arbiter that printed nothing, and
      # cannot tell a full verdict from one taken over a shrunken row roster or
      # over a SKIPPED oracle. So read the arbiter's own two lines, and take
      # the row count from the manifest at run time rather than typing it here.
      - name: The verdict must be the arbiter's own, over every declared row
        if: always()
        run: |
          out=verify-output.txt
          if [ ! -s "$out" ]; then
            echo "::error::the arbiter produced no output; a run that printed nothing is not a pass"
            exit 1
          fi

          # shellcheck source=/dev/null
          . ./verify.manifest.sh
          n="$MANIFEST_ROWS_N"

          if ! grep -Eq '^verify-oracle +PASS +ORACLE PASS:' "$out"; then
            echo "::error::the oracle did not run to a PASS on this runner; --oracle must never yield a SKIPPED row here"
            grep -E '^verify-oracle' "$out" || echo "there is no verify-oracle row in the output at all"
            exit 1
          fi

          if ! grep -Fxq "VERDICT: PASS ($n steps)" "$out"; then
            echo "::error::the arbiter did not print VERDICT: PASS ($n steps), the row count verify.manifest.sh declares"
            grep -E '^VERDICT:' "$out" || echo "there is no VERDICT line in the output at all"
            grep -E '^[a-z-]+ +FAIL ' "$out" || true
            exit 1
          fi

          echo "the arbiter printed VERDICT: PASS ($n steps) and ran its own oracle."

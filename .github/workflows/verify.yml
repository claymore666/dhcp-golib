name: verify

# DECISION 2026-09-08 (D41). Every check on the way into `dev` finishes well
# under five minutes; `main` and a release may take longer; there is no
# nightly. So the lane is two lanes with one arbiter between them:
#
#   the arbiter        every row of ./verify.sh except the oracle, on a
#                      GitHub-hosted machine, on every push. Its oracle row is
#                      SKIPPED, and the skip is earned — see the job.
#   the oracle matrix  ./scripts/test-verify.sh, cut into shards, one hosted
#                      job each, and only where somebody pays for it: a push
#                      to the release branch, a dispatch, or a push whose tree
#                      reaches an arbiter no green run has published.
#
# THERE IS NO `paths:` FILTER HERE, deliberately. "The oracle's domain was
# touched" is one fact, and verify.sh already derives it — the file set its
# skip stamp hashes. A path list in this file would be that fact derived
# twice, and the looser derivation would decide which pushes are checked. The
# `domain` job asks ./verify.sh --oracle-hash instead.
#
# WHAT MUST STAY TRUE OF THE TRIGGERS: no `pull_request_target`, and no
# `secret` of any kind. `push` and `workflow_dispatch` are not reachable from
# a fork — a fork's push is a push in the fork — and internal/publication
# refuses the pairing of a fork trigger with a runner that is not one of
# GitHub's own. Since D41 no job here names a self-hosted label at all, so
# that scan is vacuous over this file and says so in its own comment; it is
# kept because it is a property of the SET, and the day a job needs a machine
# of ours it is the only thing standing between that machine and a stranger's
# tree.
#
# `pull_request` IS ABSENT AND THAT IS A CHOICE: `dev` is protected on the job
# named `the arbiter`, a branch pushed to this repository runs it on `push`,
# and the head of a pull request from a branch here is a commit that was
# pushed. A pull request from a FORK would carry no check under this rule —
# the maintainer pushes such a branch here to check it, which docs/verifying.md
# states.
on:
  push:
  workflow_dispatch:

# `actions: read` is what the oracle skip is built on: the lane asks the API
# whether a green aggregation job published this arbiter's hash. It reads runs,
# jobs and artifact metadata, and writes none of them.
permissions:
  contents: read
  actions: read

jobs:
  domain:
    name: the oracle's domain
    runs-on: ubuntu-24.04
    # A checkout, one `gh api` call and a hash. Ten times the measurement is
    # still under a minute of work; this bound exists to end a job wedged on
    # an API that never answers, not to time anything.
    timeout-minutes: 5
    outputs:
      hash: ${{ steps.domain.outputs.hash }}
      scenarios: ${{ steps.domain.outputs.scenarios }}
      shard-count: ${{ steps.domain.outputs.shard-count }}
      shards: ${{ steps.domain.outputs.shards }}
      run-oracle: ${{ steps.domain.outputs.run-oracle }}
    steps:
      - name: Check out the commit under verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE RULE OF PROPERTY 5, and it is here rather than in prose: a push to
      # the release branch and a dispatch pay for the oracle whatever the tree
      # says. Everything else is decided by the tree's own hash inside
      # domain.sh, which is the third case — a push that reaches an arbiter no
      # green run has published.
      #
      # SHARD SIZE 8, and the derivation is the argument rather than a table.
      # The count is the roster divided by it, so a scenario added to
      # verify.manifest.sh lands in a shard with nothing here edited.
      - name: Decide whether this push pays for the oracle, and cut the matrix
        id: domain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANE_ALWAYS: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'yes' || 'no' }}
        run: .github/lane/domain.sh 8 "$LANE_ALWAYS"

  oracle:
    name: oracle shard ${{ matrix.shard }}
    needs: domain
    if: ${{ needs.domain.outputs.run-oracle == 'yes' }}
    runs-on: ubuntu-24.04
    # Twice the slowest shard measured. MEASURED on run 34204814646, ten shards
    # of eight: 184s to 676s of scenario time, the job walls 207s to 694s, a
    # mean of 53s per scenario and a worst shard of 84s per scenario. Twice 694
    # is 1388s, and 25 minutes is the next whole five above it.
    timeout-minutes: 25
    strategy:
      # A shard is a share of the roster, not a sample of it. `fail-fast: true`
      # would cancel the other shards on the first red one, and a cancelled
      # shard leaves no account — which the aggregation then reads as a missing
      # shard rather than as the failure it was. Every shard runs; the
      # aggregation says what happened.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.domain.outputs.shards) }}
    steps:
      - name: Check out the commit under verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go, from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod declares no dependency, so a module cache holds nothing this
          # build needs; and the one time this lane saved a cache it tarred
          # 16,585,222,854 bytes into a store that holds ten gigabytes and hung
          # until the job timed out (run 34063690907).
          cache: false

      - name: Put this machine in the state the arbiter measures in
        run: .github/lane/prepare.sh

      # ORACLE_JOBS=1, and it is the point of sharding rather than a
      # concession. Every ceiling in verify.manifest.sh is a WALL CLOCK derived
      # with one copy of the suite running at a time; a shard that ran four
      # copies of verify.sh at once would be measuring contention against a
      # ceiling that was never derived under it, which is how the two-core
      # hosted lane's fifteen red rows happened (run 33992151078). The
      # parallelism lives ACROSS jobs, where it cannot perturb a wall clock.
      - name: Run this shard of the oracle
        env:
          ORACLE_JOBS: 1
        run: .github/lane/oracle-shard.sh "${{ matrix.shard }}/${{ needs.domain.outputs.shard-count }}" "shard-${{ matrix.shard }}.txt"

      - name: Keep this shard's account whatever the verdict was
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: shard-${{ matrix.shard }}.txt
          if-no-files-found: warn
          retention-days: 30

  oracle-verdict:
    # THE NAME IS AN INTERFACE. .github/lane/oracle-run-check.sh looks this job
    # up by name to decide whether a skip may rest on a run, and spells it in
    # one place; renaming it here without renaming it there is a lane where no
    # skip is ever earned again — loudly, since the refusal names the job it
    # could not find.
    name: the oracle verdict
    needs: [domain, oracle]
    if: ${{ needs.domain.outputs.run-oracle == 'yes' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE ATTEMPT IS IN THE NAME on both sides of this pair, and the stated
      # consequence is that "re-run failed jobs" can never aggregate: attempt 2
      # re-runs only the shards that failed, so only their accounts carry
      # attempt 2 and the aggregation refuses a roster it cannot complete. That
      # is the fail-closed direction — a partial re-run must not produce a
      # verdict over shards nobody re-ran — and the remedy is to re-run the
      # whole run, which is why the publication above may overwrite.
      - name: Collect every shard's account
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oracle-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: shards

      # The matrix's own result is an OPERAND, not the verdict: a shard that
      # failed after writing its account would otherwise be aggregated away by
      # a file that looks complete.
      #
      # `set -o pipefail`, and it is not a style choice. MEASURED on run
      # 34214582437: without it the step's exit status is tee's, so the
      # aggregation refused five red shards, printed every ::error:: line it
      # owes — and the JOB CONCLUDED SUCCESS and published this arbiter's
      # oracle pass. The refusal was intact and the pipe threw it away. Any
      # pipeline in a run: block here now either sets this or reads
      # PIPESTATUS, and a test in internal/publication refuses one that does
      # neither.
      - name: The shards, taken together, are the oracle or they are not
        run: |
          set -o pipefail
          .github/lane/oracle-aggregate.sh shards \
            "${{ needs.domain.outputs.shard-count }}" \
            "${{ needs.oracle.result }}" | tee oracle-matrix.txt

      # THE PUBLICATION, and it is the whole of what a later run's skip rests
      # on. It sits below the aggregation and below nothing else: this step
      # runs only when the step above exited zero, so there is no name to look
      # up for an arbiter whose oracle did not pass. The hash is in the NAME
      # because the name is what a later run looks up — a file that had to be
      # read to be trusted would be a file whose provenance is its own content.
      #
      # THE ESCAPE, beside the claim: the artefact expires after thirty days
      # and the lookup demands an unexpired one, so an untouched arbiter is
      # re-proved after thirty days rather than skipped forever. That is the
      # fail-closed direction and it is deliberate.
      #
      # `overwrite`, and it is why this name alone carries no run attempt while
      # the shard names above do. The name IS the key: the lookup is an exact
      # `?name=oracle-pass-<hash>` query, so an attempt number in it would make
      # the key unguessable and force a prefix scan, which is a weaker lookup
      # than the one the design rests on. Re-running a green run whole would
      # then collide on the name and fail a job that had just done the work
      # correctly. Replacing is the honest reading: the run publishing is the
      # run that just aggregated a green matrix at this hash, which is exactly
      # what the previous attempt's artefact said.
      - name: Publish that this arbiter's oracle passed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-pass-${{ needs.domain.outputs.hash }}
          path: |
            oracle-matrix.txt
            shards
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  verify:
    # THE REQUIRED CHECK. `dev` is protected on this job's name.
    name: the arbiter
    # `!cancelled()` and not `always()`: this job runs when the oracle was not
    # asked for (its needs are then SKIPPED, which `success()` would refuse and
    # a lane with no arbiter at all is not a lane), and it runs when the oracle
    # was asked for and went RED — where it then fails loudly, because no run
    # has published this arbiter and the skip cannot be earned. What it never
    # does is disappear: an absent check is not a green check.
    needs: [domain, oracle-verdict]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Twice the slowest measurement, which is the rule every timeout in this
    # repository is derived by. MEASURED on this image: the whole job took 243s
    # on run 34204814646, of which the arbiter itself was 198s; twice 243 is
    # 486, and 10 minutes is the next whole minute above it. Re-derive it here,
    # from three runs at the head, whenever the lane's machine changes.
    timeout-minutes: 10
    # AT THE JOB, not at the two steps that need it. Both the step that earns
    # the skip and the step that re-checks it ask the API, and giving one of
    # them the environment and not the other is not a hypothetical: run
    # 34204814646 did exactly that, and the second read refused with `GH_REPO
    # is unset` over a skip that was in fact honest. The refusal was correct
    # and the wiring was not.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the commit under verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go, from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Put this machine in the state the arbiter measures in
        run: .github/lane/prepare.sh

      # Deliberately `uname -srm` and not `uname -a` or `uname -n`: this
      # artefact is kept for thirty days, it is read by anyone who can read the
      # run, and this repository does not put the name of a machine on the
      # public record.
      #
      # THE LOAD FIGURE IS NEW, 2026-09-08, and it answers a carried review row
      # rather than being decoration. Contention is a live cause of a red
      # ceiling row — a co-tenant cost netns-suite 16 s of its 50 s margin on
      # run 34067850871 — and no run recorded whether it was present, so the
      # first red of that class reads as drift in the suite. It is printed
      # BEFORE and AFTER the arbiter, because a figure taken once cannot say
      # whether the load arrived during the measurement.
      - name: Record the machine this measurement was taken on
        run: |
          set -o pipefail
          {
            echo "run:            ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "commit:         ${GITHUB_SHA}"
            echo "kernel:         $(uname -srm)"
            echo "cores (nproc):  $(nproc)"
            echo "memory (kB):    $(sed -n 's/^MemTotal: *//p' /proc/meminfo)"
            echo "load before:    $(cut -d' ' -f1-3 /proc/loadavg)"
            echo "dnsmasq:        $( (command -v dnsmasq >/dev/null && dnsmasq --version || /usr/sbin/dnsmasq --version || true) | head -n 1)"
            echo "go:             $(go version)"
            echo "userns maxuser: $(cat /proc/sys/user/max_user_namespaces 2>&1 || true)"
            echo "shellcheck:     $( (shellcheck --version || true) | sed -n 's/^version: //p')"
          } | tee runner-facts.txt

      # The unit-suite row is a WALL CLOCK against a ceiling, and that ceiling
      # asks one question: has the suite drifted into WAITING. A cold -race
      # build is not waiting, and on a fresh hosted machine the build IS cold —
      # which is exactly the case this step exists for, and the case the
      # standing-runner lane had stopped having.
      - name: Compile the race build before anything is timed against a ceiling
        run: go test -race -count=1 -run '^$' ./... > /dev/null

      # EARN THE SKIP, or do not get one. This writes the local stamp only
      # after the API says a green `the oracle verdict` job published this
      # tree's arbiter hash; with no stamp, ./verify.sh below runs the whole
      # oracle itself and this job hits its timeout instead of reporting a
      # green it did not earn.
      - name: Earn the oracle skip, or refuse to
        run: .github/lane/oracle-skip.sh "$PWD" oracle-justification.txt

      - name: Run the arbiter
        run: |
          started="$(date +%s)"
          set +e
          ./verify.sh 2>&1 | tee verify-output.txt
          rc="${PIPESTATUS[0]}"
          set -e
          printf 'arbiter exit status: %d\narbiter wall clock: %ds\nload after:     %s\n' \
            "$rc" "$(( $(date +%s) - started ))" "$(cut -d' ' -f1-3 /proc/loadavg)" |
            tee -a runner-facts.txt
          exit "$rc"

      - name: Keep the output whatever the verdict was
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verify-output.txt
            runner-facts.txt
            oracle-justification.txt
          if-no-files-found: warn
          retention-days: 30

      # The vacuity refusal, and it lives in .github/lane/verdict.sh rather
      # than here for two reasons that are the same reason: the shellcheck row
      # lints a script and cannot lint a `run:` block, and a scenario can drive
      # a script and cannot drive a step.
      - name: The verdict must be the arbiter's own, over every declared row
        if: always()
        run: .github/lane/verdict.sh verify-output.txt oracle-justification.txt

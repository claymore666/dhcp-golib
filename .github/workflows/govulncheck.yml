name: govulncheck

# Reachable-vulnerability scan. This module requires nothing outside the
# standard library, so what this scan is really about is the STANDARD LIBRARY:
# the version of it a consumer of this library builds against, and whether any
# advisory against it is reachable from code this module actually calls.
#
# THE SCAN HAS TEETH AND THEY WERE MEASURED, not assumed. On 2026-09-08 the
# same command over this tree, with a go1.25.0 toolchain, reported
# GO-2026-4602 ("FileInfo can escape from a Root in os", fixed in go1.25.8)
# through internal/gates/scan calling filepath.WalkDir, and exited 3; with the
# newest 1.25 toolchain it reports nothing and exits 0. The version scanned is
# the one `setup-go` resolves from the `go` line in go.mod, which is the newest
# patch of that minor — so a red here says the newest toolchain a consumer can
# build this with has a reachable advisory, which is a thing to act on rather
# than a thing to wait out.
#
# THE SCANNER IS PINNED, AND THE SENTENCE THAT USED TO STAND HERE WAS WRONG.
# It said a pinned scanner is a scanner that stops learning, because its whole
# value is knowing about an advisory published after the pin was written. That
# is not how govulncheck is built. The advisory data lives behind `-db`,
# default https://vuln.go.dev, and is fetched at scan time; the binary carries
# analysis code, not advisories. MEASURED 2026-09-11: the v1.7.0 binary,
# released 2026-08-13, reports GO-2026-6238, published 2026-08-18, against a
# module that calls the affected symbol. A pin freezes the analysis, not the
# data, so the reason for floating was paid for with nothing.
#
# WHAT FLOATING COST, measured: x/vuln v1.8.0 published 2026-09-08 and declares
# `go 1.26.0`. setup-go resolves the `go 1.25` line in go.mod to 1.25.14, so
# every run since died in `go install` with "requires go >= 1.26.0", and the
# scan did not run at all. A floating scanner turned a check with teeth into a
# red step on a schedule nobody here controls.
#
# v1.7.0 IS THE NEWEST x/vuln WHOSE `go` LINE THIS TOOLCHAIN SATISFIES: v1.3.0
# through v1.7.0 all declare `go 1.25.0`, v1.8.0 is the first to want 1.26.0.
# Raising the go line in go.mod would be the other way to take v1.8.0, and it
# is not this workflow's to raise: that line says what a consumer of this
# library must build with. The plugin repository pins its scanner the same way,
# so one fact is derived one way in both places.
#
# WHAT THE PIN COSTS, beside the claim: analysis improvements, not coverage,
# and it decays silently. Nothing goes red when a newer x/vuln appears that
# this toolchain could build, because reddening this lane on a release schedule
# is the failure being fixed. Re-read the pin when the go line in go.mod moves.
#
# BOUND, beside the claim: nothing here drives the scanner over a KNOWN
# vulnerable tree on every run, so a govulncheck that silently stopped
# reporting would look exactly like a clean scan. What is measured is the pair
# above, on one day, by hand. A gate that plants a vulnerability would need a
# vulnerable dependency to plant, and this module has no dependency to make
# vulnerable.
on:
  push:
  pull_request:
  schedule:
    # Weekly, and it is the trigger that matters most here: an advisory
    # publishes on its own schedule and this module can go a month without a
    # commit. A scan that only runs on pushes learns nothing between them.
    - cron: '41 6 * * 3'

permissions:
  contents: read

jobs:
  scan:
    name: Scan for reachable advisories
    runs-on: ubuntu-24.04
    # MEASURED at 2401a1a, this branch's first head, over both runs that head
    # produced: push 34225532129 took 23s, pull_request 34225540921 took 28s.
    # Two runs, not three - one push makes one of each. Ten minutes is not
    # twice a measured worst case; it is the bound that ends a job wedged on
    # the vulnerability database, twenty times above the measurement.
    timeout-minutes: 10
    steps:
      - name: Check out the commit under scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go, from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The guard before the install, not after it: a `go install` that
      # refuses prints a toolchain error and no name, and this names both
      # operands. It lives in a file rather than a `run:` block because a
      # script is linted by the arbiter's shellcheck row and can drive
      # itself; a step is neither.
      # The self-test runs FIRST. A guard whose verdict is trusted before
      # anything has shown it can still answer both ways is a guard with one
      # possible verdict, and this one's whole job is to say no.
      - name: The guard can still answer both ways
        run: .github/lane/govulncheck-pin.sh --self-test

      - name: The pin and this toolchain agree
        run: .github/lane/govulncheck-pin.sh

      - name: Install the scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Which toolchain this verdict is about
        run: go version

      - name: Scan every package in the module
        run: govulncheck ./...
